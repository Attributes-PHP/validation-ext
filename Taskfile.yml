# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  VENDOR_DIR: vendor

tasks:
  _ensure-vendor:
    internal: true
    cmds:
      - test -d {{.VENDOR_DIR}} || composer install

  _ensure-gen_stub:
    internal: true
    cmds:
      - test -f build/gen_stub.php || task build

  build:
    desc: Build the PHP extension
    cmds:
      # phpize & ./configure only need to run if Makefiles don't exist yet.
      # Using standard "make" handles incremental C compilation efficiently.
      - |
        if [ ! -f Makefile ]; then
          phpize && ./configure --enable-attributes-validation
        fi
      - make

  watch:
    desc: Watch source files and automatically rebuild the PHP extension
    cmds:
      - reflex --inverse-regex='(\.dep$|\.lo$|\.o$|/config\.|/Makefile$|\.libs/|/ext/|config\.log$)' -r '\.(c|h|m4|w32)$' -- task build

  stubs:
    desc: Generate arginfo stubs
    deps:
      - _ensure-gen_stub
    cmds:
      - php build/gen_stub.php

  format:
    desc: Formats C and PHP files
    deps:
      - format:c
      - format:php

  format:php:
    desc: Run mago format on test files
    deps:
      - _ensure-vendor
    cmds:
      - ./vendor/bin/mago format tests/Integration

  format:c:
    desc: Format C sources in place with clang-format
    cmds:
      - find . -path ./.git -prune -o -path ./build -prune -o -path ./confdefs.h -prune -o -path ./.libs -prune -o \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 clang-format -i

  test:format:php:
    desc: Checks PHP files are formated correctly
    deps:
      - _ensure-vendor
    cmds:
      - ./vendor/bin/mago format tests/Integration --check

  test:format:c:
    desc: Check C formatting with clang-format (fails on violations)
    cmds:
      - find . -path ./.git -prune -o -path ./build -prune -o -path ./confdefs.h -prune -o -path ./.libs -prune -o \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror

  test:lint:
    desc: Lints C and PHP files
    deps:
      - test:lint:c
      - test:lint:php

  test:lint:php:
    desc: Run mago lint on test files
    deps:
      - _ensure-vendor
    cmds:
      - ./vendor/bin/mago lint tests/Integration

  test:lint:c:
    desc: Run clang-tidy static analysis on C sources
    deps:
      - build
    cmds:
      - |
        set -euo pipefail
        mapfile -t sources < <(grep -oE '[a-zA-Z0-9_./]+\.c' config.m4 | tr ',' '\n' | sed 's/^ *//' | sort -u)
        clang-tidy --config-file=.clang-tidy -p . "${sources[@]}"

  test:coverage:
    desc: Run Pest tests with coverage
    deps:
      - _ensure-vendor
    cmds:
      - ./vendor/bin/pest --coverage tests/Integration

  test:unit:
    desc: Run C unit tests via Ceedling
    cmds:
      - ceedling

  test:integration:
    desc: Run PHP integration tests
    deps:
      - _ensure-vendor
    cmds:
      - ./vendor/bin/pest --colors=always tests/Integration

  test:
    desc: Run all tests (lint, unit, integration)
    deps:
      - test:lint
      - test:format:c
      - test:unit
      - test:integration

  clean:src:
    desc: Clean extension build artifacts
    cmds:
      - make clean || true
      - phpize --clean || true

  clean:test:
    desc: Clean Ceedling test artifacts
    cmds:
      - ceedling clean

  clean:
    desc: Clean all build and test artifacts
    deps:
      - clean:src
      - clean:test
