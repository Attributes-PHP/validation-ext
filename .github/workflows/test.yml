name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-c:
    name: Lint and format C sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          ini-values: memory_limit=-1

      - name: Install Bear (compile_commands.json generator)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bear

      - name: Check C formatting (clang-format)
        run: |
          find . -path ./.git -prune -o \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Build the extension and generate compile_commands.json
        run: |
          phpize
          ./configure --enable-attributes-validation
          bear -- make

      - name: Run C static analysis (clang-tidy)
        run: |
          set -euo pipefail
          # Only analyse the extension source files (the ones compiled via
          # config.m4), not the Ceedling test files which use a separate build.
          mapfile -t sources < <(grep -oE '[a-zA-Z0-9_./]+\.c' config.m4 | tr ',' '\n' | sed 's/^ *//' | sort -u)
          printf 'Analysing %d source files\n' "${#sources[@]}"
          clang-tidy --config-file=.clang-tidy -p . "${sources[@]}"

  test:
    name: Run tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          ini-values: memory_limit=-1

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby for Ceedling
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Ceedling
        run: gem install ceedling -v 1.1.2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build the extension
        run: |
          phpize
          ./configure --enable-attributes-validation
          make
          sudo make install
          echo "extension=attributes_validation" | sudo tee "$(php-config --ini-dir)/attributes_validation.ini"

      - name: Run linter
        run: task test:lint

      - name: Run C unit tests
        run: task test:unit

      - name: Run integration tests
        run: task test:integration
